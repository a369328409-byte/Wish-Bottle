<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='96' fill='%23b69be0'/%3E%3Ctext x='256' y='330' text-anchor='middle' font-size='280' fill='white' font-family='serif'%3E✦%3C/text%3E%3C/svg%3E">
    <title>我de心愿瓶</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Noto+Serif+SC:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        @font-face {
            font-family: 'DigitSong';
            src: local('Songti SC'), local('Songti'), local('STSong'), local('SimSun'), local('NSimSun'), local('宋体');
            unicode-range: U+30-39, U+2E, U+25;
        }
        body {
            background: linear-gradient(165deg, #f5eff8 0%, #ede3f5 100%);
            display: flex;
            justify-content: center;
            padding: 20px 12px 48px;
            min-height: 100vh;
            font-family: 'DigitSong', 'Noto Serif SC', 'Songti SC', 'STSong', Georgia, serif;
        }
        .container { max-width: 410px; width: 100%; }

        /* ===== 标题区域 ===== */
        .header {
            text-align: center;
            margin-bottom: 20px;
            padding-top: 6px;
        }
        .header .en-title {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-style: italic;
            font-weight: 300;
            font-size: 33px;
            letter-spacing: 0.06em;
            color: #a588c0;
            line-height: 1;
            margin-bottom: 2px;
        }
        .header .cn-title {
            font-family: 'Noto Serif SC', 'Songti SC', serif;
            font-weight: 470;
            font-size: 18px;
            letter-spacing: 0.26em;
            color: #503b63;
            margin-bottom: 2px;
        }
        .header .sub-en {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-style: italic;
            font-weight: 290;
            font-size: 14px;
            color: #ab95be;
            letter-spacing: 0.05em;
        }

        /* ===== 卡片 ===== */
        .card {
            background: rgba(255, 250, 252, 0.78);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 28px;
            padding: 18px 18px;
            margin-bottom: 14px;
            border: 1px solid rgba(185, 148, 212, 0.15);
            box-shadow: 0 8px 38px rgba(135, 85, 172, 0.09), 0 2px 8px rgba(176, 141, 204, 0.05);
        }
        .card-title {
            font-family: 'Cormorant Garamond', 'Noto Serif SC', serif;
            font-weight: 490;
            font-size: 18px;
            letter-spacing: 0.055em;
            color: #463359;
            margin-bottom: 12px;
            display: flex;
            align-items: baseline;
            gap: 6px;
        }
        .card-title .en-deco {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-weight: 280;
            font-size: 13px;
            color: #ab95be;
            letter-spacing: 0.04em;
        }

        /* ===== 数据看板 ===== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            text-align: center;
        }
        .stat-item {
            background: rgba(243, 234, 250, 0.55);
            border-radius: 21px;
            padding: 10px 2px;
            border: 1px solid rgba(184, 152, 209, 0.08);
        }
        .stat-num {
            font-family: 'DigitSong', 'Cormorant Garamond', Georgia, serif;
            font-weight: 460;
            font-size: 24px;
            letter-spacing: 0.02em;
            color: #362747;
            line-height: 1.2;
        }
        .stat-label {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 350;
            font-size: 11px;
            letter-spacing: 0.065em;
            text-transform: uppercase;
            color: #856f99;
            margin-top: 1px;
        }

        /* ===== 心愿 ===== */
        .goal-item {
            background: rgba(244, 237, 250, 0.68);
            border-radius: 18px;
            padding: 9px 12px;
            margin-bottom: 6px;
            border: 1px solid rgba(192, 164, 217, 0.10);
        }
        .goal-line1 {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .goal-name {
            font-family: 'Noto Serif SC', serif;
            font-weight: 510;
            font-size: 14px;
            color: #322444;
            letter-spacing: 0.038em;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .goal-note {
            flex: 1;
            min-width: 0;
            font-size: 11px;
            font-style: italic;
            color: #a28cb5;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .goal-price {
            margin-left: auto;
            flex-shrink: 0;
            font-family: 'DigitSong', 'Cormorant Garamond', serif;
            font-weight: 520;
            font-size: 13px;
            color: #503b63;
        }
        .bar-bg {
            flex: 1;
            height: 5px;
            background: #e7daf0;
            border-radius: 50px;
            overflow: hidden;
        }
        .bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #cfaee8, #a882ce);
            border-radius: 50px;
            transition: width 0.3s;
        }
        .goal-pct {
            flex-shrink: 0;
            font-family: 'DigitSong', 'Cormorant Garamond', serif;
            font-weight: 440;
            font-size: 13px;
            color: #674d7c;
            min-width: 34px;
            text-align: right;
        }
        .goal-line2 {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 7px;
        }
        .buy-btn {
            flex-shrink: 0;
            font-family: 'Noto Serif SC', serif;
            background: #c8afe0;
            color: #382849;
            border: none;
            border-radius: 46px;
            padding: 4px 12px;
            font-size: 11px;
            font-weight: 460;
            cursor: pointer;
            white-space: nowrap;
            letter-spacing: 0.042em;
            transition: background 0.15s;
        }
        .buy-btn:disabled {
            background: #e2d6ec;
            color: #ae9abe;
            cursor: not-allowed;
        }
        .buy-btn:not(:disabled):hover {
            background: #bb9fd7;
        }
        .goal-del {
            flex-shrink: 0;
            font-family: 'Noto Serif SC', serif;
            color: #cf91b0;
            font-size: 14px;
            line-height: 1;
            padding: 2px 4px;
            cursor: pointer;
            opacity: 0.35;
            transition: opacity 0.15s;
        }
        .goal-del:hover { opacity: 1; }

        .add-btn {
            width: 100%;
            padding: 10px;
            border: 1.5px dashed #d8c4e8;
            border-radius: 56px;
            background: rgba(236, 224, 247, 0.29);
            color: #775f8b;
            font-family: 'Noto Serif SC', serif;
            font-size: 14px;
            cursor: pointer;
            margin-top: 6px;
            letter-spacing: 0.058em;
            transition: background 0.15s;
        }
        .add-btn:hover { background: rgba(233, 218, 246, 0.49); }

        .empty-hint {
            font-family: 'Cormorant Garamond', 'Noto Serif SC', serif;
            font-style: italic;
            color: #a288b5;
            text-align: center;
            padding: 12px 0 6px;
            font-size: 14px;
            letter-spacing: 0.036em;
        }

        /* ===== 已实现折叠 ===== */
        .fold-toggle {
            font-family: 'DigitSong', 'Noto Serif SC', serif;
            background: none;
            border: none;
            color: #735c87;
            font-size: 13px;
            cursor: pointer;
            padding: 6px 0;
            width: 100%;
            text-align: left;
            letter-spacing: 0.034em;
        }
        .fold-body { display: none; margin-top: 4px; }
        .fold-body.open { display: block; }
        .achieve-item {
            background: #efe6f5;
            border-radius: 18px;
            padding: 8px 12px;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #523f63;
            border: 1px solid rgba(198, 169, 223, 0.08);
        }
        .achieve-item .restore {
            margin-left: auto;
            background: #dcc6ee;
            border: none;
            border-radius: 54px;
            padding: 3px 14px;
            font-size: 11px;
            cursor: pointer;
            font-family: 'Noto Serif SC', serif;
            color: #3e2b52;
        }

        /* ===== 日期导航 ===== */
        .date-nav {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            margin-bottom: 12px;
        }
        .date-nav #prevDay {
            justify-self: start;
            min-width: 92px;
            text-align: left;
        }
        .date-nav .right-cell {
            justify-self: end;
            min-width: 92px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 4px;
        }
        .date-nav button {
            background: none;
            border: none;
            color: #b69bcb;
            font-size: 18px;
            cursor: pointer;
            padding: 4px 8px;
            transition: color 0.12s;
        }
        .date-nav button:hover { color: #936fb0; }
        .date-nav .mid {
            font-family: 'DigitSong', 'Cormorant Garamond', 'Noto Serif SC', serif;
            font-weight: 435;
            font-size: 17px;
            color: #382749;
            letter-spacing: 0.026em;
        }
        .date-nav .today {
            font-family: 'Noto Serif SC', serif;
            background: #e4d6ef;
            border: none;
            border-radius: 70px;
            padding: 3px 14px;
            font-size: 12px;
            color: #422f57;
            cursor: pointer;
            letter-spacing: 0.033em;
        }

        /* ===== 任务 ===== */
        .task-item {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(241, 232, 249, 0.51);
            border-radius: 22px;
            padding: 10px 12px;
            margin-bottom: 6px;
            border: 1px solid rgba(197, 171, 219, 0.07);
        }
        .task-check {
            width: 22px;
            height: 22px;
            border-radius: 66px;
            border: 2px solid #cfb8e3;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: 0.12s;
            font-size: 12px;
            color: white;
        }
        .task-check.done { background: #b79bd3; border-color: #b79bd3; }
        .task-info { flex: 1; min-width: 0; }
        .task-name {
            font-family: 'Noto Serif SC', serif;
            font-size: 14px;
            color: #302340;
            letter-spacing: 0.019em;
        }
        .task-name.line { text-decoration: line-through; opacity: 0.41; }
        .task-line {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .task-line .task-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .task-meta {
            flex-shrink: 0;
            margin-left: auto;
            white-space: nowrap;
            font-family: 'DigitSong', 'Cormorant Garamond', serif;
            font-size: 12px;
            color: #826992;
        }
        .badge {
            font-family: 'Noto Serif SC', serif;
            background: #e4d6ef;
            padding: 0 10px;
            border-radius: 74px;
            font-size: 10px;
            color: #402e53;
            letter-spacing: 0.029em;
        }
        .del-task {
            color: #cf91b0;
            font-size: 16px;
            cursor: pointer;
            opacity: 0.34;
            padding: 4px;
            transition: opacity 0.12s;
        }
        .del-task:hover { opacity: 0.75; }

        .add-task-row {
            display: flex;
            gap: 6px;
            margin-top: 8px;
            width: 100%;
        }
        .add-task-row input {
            flex: 1;
            min-width: 0;
            border: 1px solid #dcc6ee;
            border-radius: 77px;
            padding: 9px 16px;
            font-size: 14px;
            background: rgba(254, 250, 255, 0.73);
            outline: none;
            font-family: 'DigitSong', 'Noto Serif SC', serif;
            letter-spacing: 0.014em;
            color: #332544;
        }
        .add-task-row input::placeholder { color: #b59fc7; font-style: italic; }
        .add-task-row input:focus { border-color: #c3a6dc; }
        .add-task-row button {
            font-family: 'Noto Serif SC', serif;
            background: #c8afe0;
            border: none;
            color: #382849;
            border-radius: 83px;
            padding: 9px 16px;
            font-size: 13px;
            font-weight: 445;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
            min-width: 56px;
            letter-spacing: 0.031em;
            transition: background 0.12s;
        }
        .add-task-row button:hover { background: #bb9fd7; }

        .type-toggle {
            display: flex;
            justify-content: flex-end;
            gap: 6px;
            margin-top: 6px;
        }
        .type-toggle button {
            font-family: 'Noto Serif SC', serif;
            background: #ede3f5;
            border: none;
            border-radius: 70px;
            padding: 3px 14px;
            font-size: 11px;
            color: #452f5b;
            cursor: pointer;
            letter-spacing: 0.026em;
            transition: background 0.12s;
        }
        .type-toggle button.active { background: #c8afe0; color: #2d1e3e; }

        /* ===== 随笔 ===== */
        .note-area { display: flex; flex-direction: column; }
        .note-area textarea {
            width: 100%;
            border: 1px solid #dcc6ee;
            border-radius: 24px;
            padding: 12px 16px;
            font-size: 14px;
            background: rgba(254, 250, 255, 0.61);
            resize: vertical;
            min-height: 94px;
            outline: none;
            font-family: 'DigitSong', 'Noto Serif SC', serif;
            letter-spacing: 0.009em;
            color: #2d1f3b;
            line-height: 1.7;
        }
        .note-area textarea::placeholder { color: #bda8cf; font-style: italic; }
        .note-area textarea:focus { border-color: #c3a6dc; }
        .note-area .save-note {
            font-family: 'Noto Serif SC', serif;
            background: #c8afe0;
            color: #382849;
            border: none;
            border-radius: 77px;
            padding: 6px 20px;
            font-size: 13px;
            font-weight: 437;
            cursor: pointer;
            margin-top: 8px;
            align-self: flex-end;
            letter-spacing: 0.037em;
            transition: background 0.12s;
        }
        .note-area .save-note:hover { background: #bb9fd7; }

        /* ===== 弹窗 ===== */
        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(105, 70, 137, 0.28);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 900;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }
        .modal {
            background: rgba(255, 250, 252, 0.89);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            max-width: 380px;
            width: 100%;
            border-radius: 46px;
            padding: 28px 24px 30px;
            border: 1px solid rgba(214, 186, 232, 0.15);
            box-shadow: 0 28px 66px rgba(81, 46, 115, 0.14);
        }
        .modal h2 {
            font-family: 'Noto Serif SC', serif;
            font-weight: 495;
            font-size: 19px;
            color: #352647;
            margin-bottom: 16px;
            letter-spacing: 0.066em;
        }
        .field { margin-bottom: 12px; }
        .field label {
            font-family: 'Noto Serif SC', serif;
            font-size: 13px;
            color: #624d76;
            display: block;
            margin-bottom: 3px;
            letter-spacing: 0.027em;
        }
        .field input {
            width: 100%;
            padding: 10px 16px;
            border: 1px solid #dcc6ee;
            border-radius: 44px;
            font-size: 15px;
            background: rgba(254, 250, 255, 0.73);
            outline: none;
            font-family: 'DigitSong', 'Noto Serif SC', serif;
            color: #2f2041;
            letter-spacing: 0.007em;
        }
        .field input:focus { border-color: #c3a6dc; }
        .modal-actions { display: flex; gap: 10px; margin-top: 18px; }
        .modal-actions button {
            flex: 1;
            padding: 12px 0;
            border-radius: 666px;
            border: none;
            font-size: 15px;
            cursor: pointer;
            font-family: 'Noto Serif SC', serif;
            letter-spacing: 0.043em;
            transition: background 0.12s;
        }
        .btn-cancel { background: #e4d6ef; color: #412d57; }
        .btn-cancel:hover { background: #dbc9ea; }
        .btn-confirm { background: #c8afe0; color: #2d1e3e; }
        .btn-confirm:hover { background: #bb9fd7; }

        .footer {
            text-align: center;
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-weight: 285;
            font-size: 13px;
            color: #b098c2;
            margin-top: 8px;
            letter-spacing: 0.048em;
        }

        @media (max-width: 374px) {
            .header .en-title { font-size: 28px; }
            .stat-num { font-size: 20px; }
        }
    </style>
</head>
<body>
<div class="container">

    <!-- 标题区域 -->
    <div class="header">
        <div class="en-title">Wish Bottle.</div>
        <div class="cn-title">我的心愿瓶</div>
        <div class="sub-en">a little jar for today's wishes</div>
    </div>

    <!-- 数据看板 -->
    <div class="card" style="padding-bottom:12px;">
        <div class="stats-grid">
            <div class="stat-item"><div class="stat-num" id="savedNum">0</div><div class="stat-label">Saved</div></div>
            <div class="stat-item"><div class="stat-num" id="goalNum">0</div><div class="stat-label">Wishes</div></div>
            <div class="stat-item"><div class="stat-num" id="doneNum">0</div><div class="stat-label">Done</div></div>
            <div class="stat-item"><div class="stat-num" id="spentNum">0</div><div class="stat-label">Spent</div></div>
        </div>
    </div>

    <!-- 心愿清单 -->
    <div class="card">
        <div class="card-title">心愿清单 <span class="en-deco">· my wishes</span></div>
        <div id="goalList"></div>
        <div class="fold-section">
            <button class="fold-toggle" id="foldBtn">▶ 已实现 (<span id="achCount">0</span>)</button>
            <div class="fold-body" id="achBody"></div>
        </div>
        <button class="add-btn" id="showGoalModal">＋ 许个小心愿</button>
    </div>

    <!-- 日记本：按天 -->
    <div class="card">
        <div class="card-title">日记本 <span class="en-deco">· daily pages</span></div>
        <!-- 日期导航 -->
        <div class="date-nav">
            <button id="prevDay"><i class="fas fa-chevron-left"></i></button>
            <span class="mid" id="dateLabel">2026-08-27 周四</span>
            <div class="right-cell">
                <button id="todayBtn" class="today">今天</button>
                <button id="nextDay"><i class="fas fa-chevron-right"></i></button>
            </div>
        </div>

        <!-- 任务 -->
        <div style="margin-bottom:6px;font-family:'Noto Serif SC',serif;font-weight:455;font-size:14px;color:#3e2b52;letter-spacing:0.039em;">今日任务</div>
        <div id="taskList"></div>
        <div class="add-task-row">
            <input type="text" id="taskInput" placeholder="如 自己做饭 +20">
            <button id="addTaskBtn">添加</button>
        </div>
        <div class="type-toggle">
            <button class="active" id="cycBtn">🔄 循环</button>
            <button id="onceBtn">🧩 单次</button>
        </div>

        <!-- 今日随笔 -->
        <div class="note-area" style="margin-top:14px;">
            <div style="font-family:'Noto Serif SC',serif;font-weight:453;font-size:14px;color:#3e2b52;margin-bottom:6px;letter-spacing:0.039em;">今日随笔</div>
            <textarea id="noteInput" placeholder="今天发生了什么……"></textarea>
            <button class="save-note" id="saveNote">保存随笔</button>
        </div>
    </div>

    <div class="footer">small days, soft wants.</div>
</div>

<!-- 新增心愿弹窗 -->
<div class="overlay" id="goalOverlay">
    <div class="modal">
        <h2>写下小心愿</h2>
        <div class="field"><label>心愿名称</label><input type="text" id="gName" placeholder="如 去大理旅行"></div>
        <div class="field"><label>所需金额 (¥)</label><input type="number" id="gPrice" placeholder="2999" min="1"></div>
        <div class="field"><label>备注 (可选)</label><input type="text" id="gNote" placeholder="比如 住洱海边民宿"></div>
        <div class="modal-actions">
            <button class="btn-cancel" id="cancelGoal">取消</button>
            <button class="btn-confirm" id="confirmGoal">存入心愿瓶</button>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/js/all.min.js"></script>
<script>
    // ====== 数据 ======
    let goals = [];
    let achieved = [];
    let cyclicTasks = [];
    let dailyRecords = {};
    let saved = 0;
    let spent = 0;
    let viewDate = new Date();

    function fmt(d) { return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
    function week(d) { return ['日','一','二','三','四','五','六'][d.getDay()]; }
    function uid() { return Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,6); }

    function load() {
        try {
            const g=localStorage.getItem('oc_goals'); if(g) goals=JSON.parse(g);
            const a=localStorage.getItem('oc_achieved'); if(a) achieved=JSON.parse(a);
            const c=localStorage.getItem('oc_cyclic'); if(c) cyclicTasks=JSON.parse(c);
            const d=localStorage.getItem('oc_daily'); if(d) dailyRecords=JSON.parse(d);
            const sv=localStorage.getItem('oc_saved'); if(sv) saved=parseFloat(sv)||0;
            const sp=localStorage.getItem('oc_spent'); if(sp) spent=parseFloat(sp)||0;
        }catch(e){}
    }
    function save() {
        localStorage.setItem('oc_goals',JSON.stringify(goals));
        localStorage.setItem('oc_achieved',JSON.stringify(achieved));
        localStorage.setItem('oc_cyclic',JSON.stringify(cyclicTasks));
        localStorage.setItem('oc_daily',JSON.stringify(dailyRecords));
        localStorage.setItem('oc_saved',saved.toString());
        localStorage.setItem('oc_spent',spent.toString());
    }

    function getRec(ds) {
        if(!dailyRecords[ds]) dailyRecords[ds] = {note:'', tasks:[]};
        return dailyRecords[ds];
    }

    function getDayTasks(ds) {
        const rec = getRec(ds);
        const cyc = cyclicTasks.map(ct => {
            const exist = rec.tasks.find(t => t.id===ct.id && t.isCyclic);
            return { id:ct.id, name:ct.name, reward:ct.reward, done:exist?exist.done:false, isCyclic:true };
        });
        const once = rec.tasks.filter(t => !t.isCyclic).map(t => ({...t}));
        return [...cyc, ...once];
    }

    function renderAll() {
        renderStats();
        renderGoals();
        renderAchieved();
        renderDayView();
    }

    function renderStats() {
        document.getElementById('savedNum').textContent = Math.floor(saved);
        document.getElementById('goalNum').textContent = goals.length;
        let totalDone = 0;
        for(let k in dailyRecords) {
            dailyRecords[k].tasks.forEach(t => { if(t.done) totalDone++; });
        }
        document.getElementById('doneNum').textContent = totalDone;
        document.getElementById('spentNum').textContent = Math.floor(spent);
    }

    function renderGoals() {
        const el = document.getElementById('goalList');
        if(!goals.length) { el.innerHTML='<div class="empty-hint">💜 还没有心愿，许个愿吧</div>'; return; }
        el.innerHTML = goals.map((g,i) => {
            const pct = g.price>0 ? Math.min(100,(saved/g.price)*100) : 0;
            const canBuy = saved >= g.price;
            return `<div class="goal-item">
                <div class="goal-line1"><span class="goal-name">${esc(g.name)}</span>${g.note?`<span class="goal-note" title="${esc(g.note)}">${esc(g.note)}</span>`:''}<span class="goal-price">¥${g.price.toFixed(2)}</span></div>
                <div class="goal-line2"><div class="bar-bg"><div class="bar-fill" style="width:${pct}%"></div></div><span class="goal-pct">${Math.floor(pct)}%</span><button class="buy-btn" ${canBuy?'':'disabled'} onclick="doAchieve(${i})">${canBuy?'🎉 拿下':'💰 还不够'}</button><span class="goal-del" onclick="delGoal(${i})">✕</span></div>
            </div>`;
        }).join('');
    }

    function renderAchieved() {
        document.getElementById('achCount').textContent = achieved.length;
        const body = document.getElementById('achBody');
        if(!achieved.length) { body.innerHTML=''; return; }
        body.innerHTML = achieved.map((g,i) =>
            `<div class="achieve-item"><span>✅ ${esc(g.name)} · ¥${g.price.toFixed(2)}</span><button class="restore" onclick="undoAch(${i})">撤回</button></div>`
        ).join('');
    }

    function renderDayView() {
        const ds = fmt(viewDate);
        const rec = getRec(ds);
        document.getElementById('dateLabel').textContent = ds + ' 周' + week(viewDate);
        document.getElementById('todayBtn').style.visibility = ds === fmt(new Date()) ? 'hidden' : 'visible';
        const tasks = getDayTasks(ds);
        const el = document.getElementById('taskList');
        if(!tasks.length) { el.innerHTML='<div class="empty-hint">✨ 添加今天的任务吧</div>'; return; }
        let doneCnt=0;
        el.innerHTML = tasks.map(t => {
            if(t.done) doneCnt++;
            const chkCls = t.done?'task-check done':'task-check';
            const nameCls = t.done?'task-name line':'task-name';
            const badge = t.isCyclic?'<span class="badge">循环</span>':'<span class="badge">单次</span>';
            return `<div class="task-item">
                <div class="${chkCls}" onclick="toggleTask('${t.id}','${ds}')">${t.done?'✓':''}</div>
                <div class="task-info"><div class="task-line"><span class="${nameCls}">${esc(t.name)}</span>${badge}<span class="task-meta">+${t.reward}💰</span></div></div>
                <div class="del-task" onclick="delDayTask('${t.id}','${ds}')">✕</div>
            </div>`;
        }).join('');
        document.getElementById('noteInput').value = rec.note || '';
    }

    window.doAchieve = function(i) {
        const g = goals[i];
        if(saved < g.price) return;
        if(!confirm(`拿下「${g.name}」？扣 ¥${g.price.toFixed(2)}`)) return;
        saved -= g.price;
        spent += g.price;
        achieved.push({...g});
        goals.splice(i,1);
        save(); renderAll();
    };
    window.undoAch = function(i) {
        const g = achieved[i];
        if(!confirm(`撤回「${g.name}」？退回 ¥${g.price.toFixed(2)}`)) return;
        saved += g.price;
        spent -= g.price;
        goals.push({...g});
        achieved.splice(i,1);
        save(); renderAll();
    };
    window.delGoal = function(i) {
        if(!confirm('删掉这个心愿？')) return;
        goals.splice(i,1);
        save(); renderAll();
    };

    window.toggleTask = function(id, ds) {
        const rec = getRec(ds);
        const ci = cyclicTasks.findIndex(ct => ct.id === id);
        if(ci !== -1) {
            const exist = rec.tasks.find(t => t.id===id && t.isCyclic);
            if(exist) {
                if(exist.done) { exist.done=false; saved-=cyclicTasks[ci].reward; }
                else { exist.done=true; saved+=cyclicTasks[ci].reward; }
            } else {
                rec.tasks.push({id, name:cyclicTasks[ci].name, reward:cyclicTasks[ci].reward, done:true, isCyclic:true});
                saved+=cyclicTasks[ci].reward;
            }
        } else {
            const t = rec.tasks.find(t => t.id===id && !t.isCyclic);
            if(t) {
                if(t.done) { t.done=false; saved-=t.reward; }
                else { t.done=true; saved+=t.reward; }
            }
        }
        if(saved<0) saved=0;
        save(); renderAll();
    };

    window.delDayTask = function(id, ds) {
        const rec = getRec(ds);
        const ci = cyclicTasks.findIndex(ct => ct.id === id);
        if(ci !== -1) {
            if(!confirm('删除这个每日循环任务？（所有天的此任务都会消失）')) return;
            for(let k in dailyRecords) {
                dailyRecords[k].tasks = dailyRecords[k].tasks.filter(t => !(t.id===id && t.isCyclic));
            }
            cyclicTasks.splice(ci,1);
        } else {
            const t = rec.tasks.find(t => t.id===id && !t.isCyclic);
            if(t && t.done) { saved = Math.max(0, saved - t.reward); }
            rec.tasks = rec.tasks.filter(t => t.id !== id);
        }
        save(); renderAll();
    };

    document.getElementById('prevDay').onclick = () => { viewDate.setDate(viewDate.getDate()-1); renderAll(); };
    document.getElementById('nextDay').onclick = () => { viewDate.setDate(viewDate.getDate()+1); renderAll(); };
    document.getElementById('todayBtn').onclick = () => { viewDate = new Date(); renderAll(); };

    let taskIsCyclic = true;
    document.getElementById('cycBtn').onclick = function() { this.classList.add('active'); document.getElementById('onceBtn').classList.remove('active'); taskIsCyclic=true; };
    document.getElementById('onceBtn').onclick = function() { this.classList.add('active'); document.getElementById('cycBtn').classList.remove('active'); taskIsCyclic=false; };

    document.getElementById('addTaskBtn').onclick = function() {
        const inp = document.getElementById('taskInput');
        const raw = inp.value.trim();
        if(!raw) return;
        let name = raw;
        let reward = 10;
        const m = raw.match(/[+＋](\d+(\.\d+)?)|(\d+(\.\d+)?)[💰元]/);
        if(m) {
            const num = parseFloat(m[1] || m[3]);
            if(num && num>0) reward = num;
            name = raw.replace(/[+＋]\d+(\.\d+)?|\d+(\.\d+)?[💰元]/g,'').trim();
            if(!name) name = '任务';
        }
        const ds = fmt(viewDate);
        if(taskIsCyclic) {
            const id = uid();
            cyclicTasks.push({id, name, reward});
            const rec = getRec(ds);
            rec.tasks.push({id, name, reward, done:false, isCyclic:true});
        } else {
            const rec = getRec(ds);
            rec.tasks.push({id:uid(), name, reward, done:false, isCyclic:false});
        }
        inp.value = '';
        save(); renderAll();
    };

    document.getElementById('saveNote').onclick = function() {
        const ds = fmt(viewDate);
        const rec = getRec(ds);
        rec.note = document.getElementById('noteInput').value;
        save();
        alert('📝 随笔已保存');
    };

    document.getElementById('showGoalModal').onclick = () => document.getElementById('goalOverlay').style.display='flex';
    document.getElementById('cancelGoal').onclick = () => document.getElementById('goalOverlay').style.display='none';
    document.getElementById('confirmGoal').onclick = function() {
        const name = document.getElementById('gName').value.trim();
        const price = parseFloat(document.getElementById('gPrice').value);
        const note = document.getElementById('gNote').value.trim();
        if(!name || !price || price<=0) { alert('请填写心愿名称和金额'); return; }
        goals.push({name, price, note});
        document.getElementById('gName').value=''; document.getElementById('gPrice').value=''; document.getElementById('gNote').value='';
        document.getElementById('goalOverlay').style.display='none';
        save(); renderAll();
    };

    document.getElementById('foldBtn').onclick = function() {
        const body = document.getElementById('achBody');
        body.classList.toggle('open');
        this.innerHTML = body.classList.contains('open') ? '▼ 已实现 ('+achieved.length+')' : '▶ 已实现 ('+achieved.length+')';
    };

    function esc(s) { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

    load();
    renderAll();
</script>
</body>
</html>
