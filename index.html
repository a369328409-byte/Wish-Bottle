<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='96' fill='%23b69be0'/%3E%3Ctext x='256' y='330' text-anchor='middle' font-size='280' fill='white' font-family='serif'%3E✦%3C/text%3E%3C/svg%3E">
    <title>我de心愿瓶</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Noto+Serif+SC:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* ===== 主题变量（默认皮肤：薰衣草紫） ===== */
        :root {
            --bg-1: #f5eff8; --bg-2: #ede3f5;
            --card-bg: rgba(255,250,252,0.78);
            --card-border: rgba(185,148,212,0.15);
            --card-shadow: 0 8px 38px rgba(135,85,172,0.09), 0 2px 8px rgba(176,141,204,0.05);
            --modal-shadow: 0 28px 66px rgba(81,46,115,0.14);
            --text-main: #362747; --text-sub: #856f99; --text-soft: #ab95be;
            --primary: #c8afe0; --primary-hover: #bb9fd7; --primary-deep: #a588c0;
            --btn-text: #382849;
            --primary-soft: #e4d6ef; --primary-soft-hover: #dbc9ea; --primary-soft-text: #422f57;
            --tint: rgba(200,175,224,0.20); --tint-strong: rgba(200,175,224,0.34); --tint-border: rgba(165,136,192,0.10);
            --bar-bg: #e7daf0;
            --input-border: #dcc6ee; --input-bg: rgba(254,250,255,0.73); --input-focus: #c3a6dc;
            --overlay-bg: rgba(105,70,137,0.28); --modal-bg: rgba(255,250,252,0.89);
            --del-color: #cf91b0;
        }
        /* 鎏金岁月 */
        .theme-gold {
            --bg-1: #fdf6e3; --bg-2: #f5e6ca;
            --card-bg: rgba(255,248,232,0.80);
            --card-border: rgba(168,136,58,0.16);
            --card-shadow: 0 8px 38px rgba(138,122,69,0.10), 0 2px 8px rgba(201,168,76,0.08);
            --modal-shadow: 0 28px 66px rgba(90,74,30,0.16);
            --text-main: #3d3518; --text-sub: #8a7a45; --text-soft: #ab9c6e;
            --primary: #c9a84c; --primary-hover: #b8963c; --primary-deep: #a8883a;
            --btn-text: #3d3011;
            --primary-soft: #f0e2b8; --primary-soft-hover: #e8d6a4; --primary-soft-text: #5c4d1d;
            --tint: rgba(201,168,76,0.18); --tint-strong: rgba(201,168,76,0.32); --tint-border: rgba(168,136,58,0.12);
            --bar-bg: #eddfb4;
            --input-border: #ddc992; --input-bg: rgba(255,252,242,0.73); --input-focus: #c9a84c;
            --overlay-bg: rgba(105,88,40,0.30); --modal-bg: rgba(255,250,238,0.90);
            --del-color: #c08a52;
        }
        /* 蜜桃轻粉 */
        .theme-pink {
            --bg-1: #fef0f5; --bg-2: #fce4ed;
            --card-bg: rgba(255,242,247,0.80);
            --card-border: rgba(212,127,152,0.16);
            --card-shadow: 0 8px 38px rgba(212,127,152,0.10), 0 2px 8px rgba(232,154,176,0.08);
            --modal-shadow: 0 28px 66px rgba(120,55,80,0.15);
            --text-main: #3d2230; --text-sub: #92586e; --text-soft: #bd8fa2;
            --primary: #e89ab0; --primary-hover: #dd87a0; --primary-deep: #d47f98;
            --btn-text: #4a2334;
            --primary-soft: #f7d8e3; --primary-soft-hover: #f2c9d8; --primary-soft-text: #6d3b50;
            --tint: rgba(232,154,176,0.18); --tint-strong: rgba(232,154,176,0.32); --tint-border: rgba(212,127,152,0.12);
            --bar-bg: #f4d2df;
            --input-border: #edc3d1; --input-bg: rgba(255,250,253,0.73); --input-focus: #e89ab0;
            --overlay-bg: rgba(148,74,100,0.28); --modal-bg: rgba(255,248,251,0.90);
            --del-color: #d47f98;
        }
        /* 晴空浅蓝 */
        .theme-blue {
            --bg-1: #eef6fc; --bg-2: #e0eef9;
            --card-bg: rgba(235,246,255,0.80);
            --card-border: rgba(98,159,201,0.16);
            --card-shadow: 0 8px 38px rgba(85,119,143,0.10), 0 2px 8px rgba(121,184,224,0.08);
            --modal-shadow: 0 28px 66px rgba(30,60,85,0.15);
            --text-main: #1f3342; --text-sub: #55778f; --text-soft: #8ba8bb;
            --primary: #79b8e0; --primary-hover: #63a9d5; --primary-deep: #629fc9;
            --btn-text: #17324a;
            --primary-soft: #cfe4f3; --primary-soft-hover: #bdd9ee; --primary-soft-text: #2c4a63;
            --tint: rgba(121,184,224,0.18); --tint-strong: rgba(121,184,224,0.32); --tint-border: rgba(98,159,201,0.12);
            --bar-bg: #cfe1ee;
            --input-border: #b6d2e7; --input-bg: rgba(248,252,255,0.73); --input-focus: #79b8e0;
            --overlay-bg: rgba(40,80,110,0.28); --modal-bg: rgba(245,251,255,0.90);
            --del-color: #d4879e;
        }
        /* 薄荷生巧 */
        .theme-mint {
            --bg-1: #d5eae3; --bg-2: #f8f4e9;
            --card-bg: rgba(248,244,233,0.82);
            --card-border: rgba(119,92,85,0.14);
            --card-shadow: 0 8px 38px rgba(94,74,68,0.10), 0 2px 8px rgba(138,122,114,0.08);
            --modal-shadow: 0 28px 66px rgba(70,55,50,0.16);
            --text-main: #5e4a44; --text-sub: #8a7a72; --text-soft: #ac9d93;
            --primary: #775c55; --primary-hover: #68504a; --primary-deep: #5e4a44;
            --btn-text: #fbf7ec;
            --primary-soft: #dce8db; --primary-soft-hover: #cddcd0; --primary-soft-text: #4a3b35;
            --tint: rgba(119,92,85,0.14); --tint-strong: rgba(119,92,85,0.26); --tint-border: rgba(94,74,68,0.12);
            --bar-bg: #ccd9cc;
            --input-border: #c2b4a9; --input-bg: rgba(253,250,242,0.73); --input-focus: #775c55;
            --overlay-bg: rgba(74,59,54,0.30); --modal-bg: rgba(252,249,240,0.90);
            --del-color: #c07860;
        }
        /* 星夜呢喃（深夜模式） */
        .theme-night {
            --bg-1: #141220; --bg-2: #1b172b;
            --card-bg: rgba(25,20,35,0.88);
            --card-border: rgba(136,120,184,0.18);
            --card-shadow: 0 8px 38px rgba(0,0,0,0.35), 0 2px 8px rgba(0,0,0,0.25);
            --modal-shadow: 0 28px 66px rgba(0,0,0,0.50);
            --text-main: #e4dff5; --text-sub: #9b8ec4; --text-soft: #6f639a;
            --primary: #8878b8; --primary-hover: #9787c6; --primary-deep: #6559a0;
            --btn-text: #17132a;
            --primary-soft: #2f2a40; --primary-soft-hover: #3a3450; --primary-soft-text: #c3b8e0;
            --tint: rgba(136,120,184,0.10); --tint-strong: rgba(136,120,184,0.22); --tint-border: rgba(136,120,184,0.14);
            --bar-bg: #2a2440;
            --input-border: #443c60; --input-bg: rgba(255,255,255,0.06); --input-focus: #8878b8;
            --overlay-bg: rgba(0,0,0,0.45); --modal-bg: rgba(28,23,42,0.94);
            --del-color: #c98aa8;
        }

        @font-face {
            font-family: 'DigitSong';
            src: local('Songti SC'), local('Songti'), local('STSong'), local('SimSun'), local('NSimSun'), local('宋体');
            unicode-range: U+30-39, U+2E, U+25;
        }
        body {
            background: linear-gradient(165deg, var(--bg-1) 0%, var(--bg-2) 100%);
            display: flex;
            justify-content: center;
            padding: 20px 12px 48px;
            min-height: 100vh;
            font-family: 'DigitSong', 'Noto Serif SC', 'Songti SC', 'STSong', Georgia, serif;
        }
        .container { max-width: 410px; width: 100%; }

        /* ===== 标题区域 ===== */
        .header {
            text-align: center;
            margin-bottom: 20px;
            padding-top: 6px;
        }
        .header .en-title {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-style: italic;
            font-weight: 300;
            font-size: 33px;
            letter-spacing: 0.06em;
            color: var(--primary-deep);
            line-height: 1;
            margin-bottom: 2px;
        }
        .header .cn-title {
            font-family: 'Noto Serif SC', 'Songti SC', serif;
            font-weight: 470;
            font-size: 18px;
            letter-spacing: 0.26em;
            color: var(--text-main);
            margin-bottom: 2px;
        }
        .header .sub-en {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-style: italic;
            font-weight: 290;
            font-size: 14px;
            color: var(--text-soft);
            letter-spacing: 0.05em;
        }

        /* ===== 卡片 ===== */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 28px;
            padding: 18px 18px;
            margin-bottom: 14px;
            border: 1px solid var(--card-border);
            box-shadow: var(--card-shadow);
        }
        .card-title {
            font-family: 'Cormorant Garamond', 'Noto Serif SC', serif;
            font-weight: 490;
            font-size: 18px;
            letter-spacing: 0.055em;
            color: var(--text-main);
            margin-bottom: 12px;
            display: flex;
            align-items: baseline;
            gap: 6px;
        }
        .card-title .en-deco {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-weight: 280;
            font-size: 13px;
            color: var(--text-soft);
            letter-spacing: 0.04em;
        }

        /* ===== 数据看板 ===== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            text-align: center;
        }
        .stat-item {
            background: var(--tint);
            border-radius: 21px;
            padding: 10px 2px;
            border: 1px solid var(--tint-border);
        }
        .stat-num {
            font-family: 'DigitSong', 'Cormorant Garamond', Georgia, serif;
            font-weight: 460;
            font-size: 24px;
            letter-spacing: 0.02em;
            color: var(--text-main);
            line-height: 1.2;
        }
        .stat-label {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 350;
            font-size: 11px;
            letter-spacing: 0.065em;
            text-transform: uppercase;
            color: var(--text-sub);
            margin-top: 1px;
        }

        /* ===== 心愿 ===== */
        .goal-item {
            background: var(--tint);
            border-radius: 18px;
            padding: 9px 12px;
            margin-bottom: 6px;
            border: 1px solid var(--tint-border);
        }
        .goal-line1 {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .goal-name {
            font-family: 'Noto Serif SC', serif;
            font-weight: 510;
            font-size: 14px;
            color: var(--text-main);
            letter-spacing: 0.038em;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .goal-note {
            flex: 1;
            min-width: 0;
            font-size: 11px;
            font-style: italic;
            color: var(--text-soft);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .goal-price {
            margin-left: auto;
            flex-shrink: 0;
            font-family: 'DigitSong', 'Cormorant Garamond', serif;
            font-weight: 520;
            font-size: 13px;
            color: var(--text-main);
        }
        .bar-bg {
            flex: 1;
            height: 5px;
            background: var(--bar-bg);
            border-radius: 50px;
            overflow: hidden;
        }
        .bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--primary), var(--primary-deep));
            border-radius: 50px;
            transition: width 0.3s;
        }
        .goal-pct {
            flex-shrink: 0;
            font-family: 'DigitSong', 'Cormorant Garamond', serif;
            font-weight: 440;
            font-size: 13px;
            color: var(--text-sub);
            min-width: 34px;
            text-align: right;
        }
        .goal-line2 {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 7px;
        }
        .buy-btn {
            flex-shrink: 0;
            font-family: 'Noto Serif SC', serif;
            background: var(--primary);
            color: var(--btn-text);
            border: none;
            border-radius: 46px;
            padding: 4px 12px;
            font-size: 11px;
            font-weight: 460;
            cursor: pointer;
            white-space: nowrap;
            letter-spacing: 0.042em;
            transition: background 0.15s;
        }
        .buy-btn:disabled {
            background: var(--primary-soft);
            color: var(--text-soft);
            cursor: not-allowed;
        }
        .buy-btn:not(:disabled):hover {
            background: var(--primary-hover);
        }
        .goal-del {
            flex-shrink: 0;
            font-family: 'Noto Serif SC', serif;
            color: var(--del-color);
            font-size: 14px;
            line-height: 1;
            padding: 2px 4px;
            cursor: pointer;
            opacity: 0.35;
            transition: opacity 0.15s;
        }
        .goal-del:hover { opacity: 1; }

        .add-btn {
            width: 100%;
            padding: 10px;
            border: 1.5px dashed var(--input-border);
            border-radius: 56px;
            background: var(--tint);
            color: var(--text-sub);
            font-family: 'Noto Serif SC', serif;
            font-size: 14px;
            cursor: pointer;
            margin-top: 6px;
            letter-spacing: 0.058em;
            transition: background 0.15s;
        }
        .add-btn:hover { background: var(--tint-strong); }

        .empty-hint {
            font-family: 'Cormorant Garamond', 'Noto Serif SC', serif;
            font-style: italic;
            color: var(--text-soft);
            text-align: center;
            padding: 12px 0 6px;
            font-size: 14px;
            letter-spacing: 0.036em;
        }

        /* ===== 已实现折叠 ===== */
        .fold-toggle {
            font-family: 'DigitSong', 'Noto Serif SC', serif;
            background: none;
            border: none;
            color: var(--text-sub);
            font-size: 13px;
            cursor: pointer;
            padding: 6px 0;
            width: 100%;
            text-align: left;
            letter-spacing: 0.034em;
        }
        .fold-body { display: none; margin-top: 4px; }
        .fold-body.open { display: block; }
        .achieve-item {
            background: var(--tint-strong);
            border-radius: 18px;
            padding: 8px 12px;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-main);
            border: 1px solid var(--tint-border);
        }
        .achieve-item .restore {
            margin-left: auto;
            background: var(--primary-soft);
            border: none;
            border-radius: 54px;
            padding: 3px 14px;
            font-size: 11px;
            cursor: pointer;
            font-family: 'Noto Serif SC', serif;
            color: var(--primary-soft-text);
        }

        /* ===== 日期导航 ===== */
        .date-nav {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            margin-bottom: 12px;
        }
        .date-nav #prevDay {
            justify-self: start;
            min-width: 92px;
            text-align: left;
        }
        .date-nav .right-cell {
            justify-self: end;
            min-width: 92px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 4px;
        }
        .date-nav button {
            background: none;
            border: none;
            color: var(--text-soft);
            font-size: 18px;
            cursor: pointer;
            padding: 4px 8px;
            transition: color 0.12s;
        }
        .date-nav button:hover { color: var(--primary-deep); }
        .date-nav .mid {
            font-family: 'DigitSong', 'Cormorant Garamond', 'Noto Serif SC', serif;
            font-weight: 435;
            font-size: 17px;
            color: var(--text-main);
            letter-spacing: 0.026em;
        }
        .date-nav .today {
            font-family: 'Noto Serif SC', serif;
            background: var(--primary-soft);
            border: none;
            border-radius: 70px;
            padding: 3px 14px;
            font-size: 12px;
            color: var(--primary-soft-text);
            cursor: pointer;
            letter-spacing: 0.033em;
        }

        /* ===== 任务 ===== */
        .task-item {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--tint);
            border-radius: 22px;
            padding: 10px 12px;
            margin-bottom: 6px;
            border: 1px solid var(--tint-border);
        }
        .task-check {
            width: 22px;
            height: 22px;
            border-radius: 66px;
            border: 2px solid var(--input-border);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: 0.12s;
            font-size: 12px;
            color: white;
        }
        .task-check.done { background: var(--primary-deep); border-color: var(--primary-deep); }
        .task-info { flex: 1; min-width: 0; }
        .task-name {
            font-family: 'Noto Serif SC', serif;
            font-size: 14px;
            color: var(--text-main);
            letter-spacing: 0.019em;
        }
        .task-name.line { text-decoration: line-through; opacity: 0.41; }
        .task-line {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .task-line .task-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .task-meta {
            flex-shrink: 0;
            margin-left: auto;
            white-space: nowrap;
            font-family: 'DigitSong', 'Cormorant Garamond', serif;
            font-size: 12px;
            color: var(--text-sub);
        }
        .badge {
            font-family: 'Noto Serif SC', serif;
            background: var(--primary-soft);
            padding: 0 10px;
            border-radius: 74px;
            font-size: 10px;
            color: var(--primary-soft-text);
            letter-spacing: 0.029em;
        }
        .del-task {
            color: var(--del-color);
            font-size: 16px;
            cursor: pointer;
            opacity: 0.34;
            padding: 4px;
            transition: opacity 0.12s;
        }
        .del-task:hover { opacity: 0.75; }

        .add-task-row {
            display: flex;
            gap: 6px;
            margin-top: 8px;
            width: 100%;
        }
        .add-task-row input {
            flex: 1;
            min-width: 0;
            border: 1px solid var(--input-border);
            border-radius: 77px;
            padding: 9px 16px;
            font-size: 14px;
            background: var(--input-bg);
            outline: none;
            font-family: 'DigitSong', 'Noto Serif SC', serif;
            letter-spacing: 0.014em;
            color: var(--text-main);
        }
        .add-task-row input::placeholder { color: var(--text-soft); font-style: italic; }
        .add-task-row input:focus { border-color: var(--input-focus); }
        .add-task-row button {
            font-family: 'Noto Serif SC', serif;
            background: var(--primary);
            border: none;
            color: var(--btn-text);
            border-radius: 83px;
            padding: 9px 16px;
            font-size: 13px;
            font-weight: 445;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
            min-width: 56px;
            letter-spacing: 0.031em;
            transition: background 0.12s;
        }
        .add-task-row button:hover { background: var(--primary-hover); }

        .type-toggle {
            display: flex;
            justify-content: flex-end;
            gap: 6px;
            margin-top: 6px;
        }
        .type-toggle button {
            font-family: 'Noto Serif SC', serif;
            background: var(--primary-soft);
            border: none;
            border-radius: 70px;
            padding: 3px 14px;
            font-size: 11px;
            color: var(--primary-soft-text);
            cursor: pointer;
            letter-spacing: 0.026em;
            transition: background 0.12s;
        }
        .type-toggle button.active { background: var(--primary); color: var(--btn-text); }

        /* ===== 随笔 ===== */
        .note-area { display: flex; flex-direction: column; }
        .note-area textarea {
            width: 100%;
            border: 1px solid var(--input-border);
            border-radius: 24px;
            padding: 12px 16px;
            font-size: 14px;
            background: var(--input-bg);
            resize: vertical;
            min-height: 94px;
            outline: none;
            font-family: 'DigitSong', 'Noto Serif SC', serif;
            letter-spacing: 0.009em;
            color: var(--text-main);
            line-height: 1.7;
        }
        .note-area textarea::placeholder { color: var(--text-soft); font-style: italic; }
        .note-area textarea:focus { border-color: var(--input-focus); }
        .note-area .save-note {
            font-family: 'Noto Serif SC', serif;
            background: var(--primary);
            color: var(--btn-text);
            border: none;
            border-radius: 77px;
            padding: 6px 20px;
            font-size: 13px;
            font-weight: 437;
            cursor: pointer;
            margin-top: 8px;
            align-self: flex-end;
            letter-spacing: 0.037em;
            transition: background 0.12s;
        }
        .note-area .save-note:hover { background: var(--primary-hover); }

        /* ===== 弹窗 ===== */
        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: var(--overlay-bg);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 900;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }
        .modal {
            background: var(--modal-bg);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            max-width: 380px;
            width: 100%;
            border-radius: 46px;
            padding: 28px 24px 30px;
            border: 1px solid var(--card-border);
            box-shadow: var(--modal-shadow);
        }
        .modal h2 {
            font-family: 'Noto Serif SC', serif;
            font-weight: 495;
            font-size: 19px;
            color: var(--text-main);
            margin-bottom: 16px;
            letter-spacing: 0.066em;
        }
        .field { margin-bottom: 12px; }
        .field label {
            font-family: 'Noto Serif SC', serif;
            font-size: 13px;
            color: var(--text-sub);
            display: block;
            margin-bottom: 3px;
            letter-spacing: 0.027em;
        }
        .field input {
            width: 100%;
            padding: 10px 16px;
            border: 1px solid var(--input-border);
            border-radius: 44px;
            font-size: 15px;
            background: var(--input-bg);
            outline: none;
            font-family: 'DigitSong', 'Noto Serif SC', serif;
            color: var(--text-main);
            letter-spacing: 0.007em;
        }
        .field input:focus { border-color: var(--input-focus); }
        .modal-actions { display: flex; gap: 10px; margin-top: 18px; }
        .modal-actions button {
            flex: 1;
            padding: 12px 0;
            border-radius: 666px;
            border: none;
            font-size: 15px;
            cursor: pointer;
            font-family: 'Noto Serif SC', serif;
            letter-spacing: 0.043em;
            transition: background 0.12s;
        }
        .btn-cancel { background: var(--primary-soft); color: var(--primary-soft-text); }
        .btn-cancel:hover { background: var(--primary-soft-hover); }
        .btn-confirm { background: var(--primary); color: var(--btn-text); }
        .btn-confirm:hover { background: var(--primary-hover); }

        .footer {
            text-align: center;
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-weight: 285;
            font-size: 13px;
            color: var(--text-soft);
            margin-top: 8px;
            letter-spacing: 0.048em;
        }

        /* ===== 换肤切换栏 ===== */
        .theme-dots {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin-top: 16px;
        }
        .theme-dot {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--dot);
            border: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.18);
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
            padding: 0;
        }
        .theme-dot:hover { transform: scale(1.15); }
        .theme-dot.active {
            transform: scale(1.2);
            box-shadow: 0 0 0 2.5px var(--text-soft), 0 2px 8px rgba(0,0,0,0.18);
        }

        @media (max-width: 374px) {
            .header .en-title { font-size: 28px; }
            .stat-num { font-size: 20px; }
        }

        /* ===== 桌面端双列布局（≥900px） ===== */
        @media (min-width: 900px) {
            body {
                padding: 16px 20px 24px;
                align-items: flex-start;
            }
            .container {
                max-width: 900px;
                max-height: calc(100vh - 40px);
                display: grid;
                grid-template-columns: 1fr 1fr;
                grid-template-rows: auto auto minmax(0, 1fr) auto auto;
                gap: 12px 20px;
            }
            /* 桌面端看板和心愿清单卡片内部更紧凑 */
            .container > .card:nth-child(2),
            .container > .card:nth-child(3) { padding: 14px 16px; }
            .container > .card:nth-child(4) { padding: 14px 16px; }
            /* 桌面端 grid 布局中，card 间距由 grid gap 控制，去掉自身 margin-bottom */
            .container > .card { margin-bottom: 0; min-height: 0; overflow: hidden; }
            .header { grid-column: 1 / -1; grid-row: 1; }
            /* 数据看板：保持自身高度，不被拉伸 */
            .container > .card:nth-child(2) { grid-column: 1; grid-row: 2; align-self: start; }
            /* 心愿清单：flex 列布局，撑满 row 3 与右栏底部对齐 */
            .container > .card:nth-child(3) {
                grid-column: 1; grid-row: 3;
                display: flex; flex-direction: column;
            }
            /* 日记本：跨 row 2-3，flex 列布局 */
            .container > .card:nth-child(4) {
                grid-column: 2;
                grid-row: 2 / span 2;
                display: flex; flex-direction: column;
            }
            .footer { grid-column: 1 / -1; grid-row: 4; }
            .theme-dots { grid-column: 1 / -1; grid-row: 5; }

            /* 列表：flex:1 自适应撑满卡片剩余空间，内容多时滚动 */
            /* 日记本子元素：允许被压缩，确保内部滚动生效 */
            .container > .card:nth-child(3) > *,
            .container > .card:nth-child(4) > * { min-height: 0; }
            #goalList {
                flex: 1;
                min-height: 80px;
                overflow-y: auto;
            }
            /* 任务列表：精确计算高度，6 条左右 */
            #taskList {
                min-height: 240px;
                max-height: 400px;
                flex: 1;
                overflow-y: auto;
            }
            /* 随笔区域：固定高度不参与 flex 扩展 */
            .note-area { flex: 0 0 auto; margin-top: 10px; }
            .note-area textarea {
                height: 60px;
                min-height: 48px;
                max-height: 80px;
                overflow-y: auto;
            }
            /* 美化滚动条 */
            #goalList::-webkit-scrollbar,
            #taskList::-webkit-scrollbar { width: 5px; }
            #goalList::-webkit-scrollbar-track,
            #taskList::-webkit-scrollbar-track { background: transparent; }
            #goalList::-webkit-scrollbar-thumb,
            #taskList::-webkit-scrollbar-thumb {
                background: var(--primary-soft);
                border-radius: 10px;
            }
            #goalList::-webkit-scrollbar-thumb:hover,
            #taskList::-webkit-scrollbar-thumb:hover { background: var(--primary); }
        }
    </style>
</head>
<body>
<div class="container">

    <!-- 标题区域 -->
    <div class="header">
        <div class="en-title">Wish Bottle.</div>
        <div class="cn-title">我的心愿瓶</div>
        <div class="sub-en">a little jar for today's wishes</div>
    </div>

    <!-- 数据看板 -->
    <div class="card" style="padding-bottom:12px;">
        <div class="stats-grid">
            <div class="stat-item"><div class="stat-num" id="savedNum">0</div><div class="stat-label">Saved</div></div>
            <div class="stat-item"><div class="stat-num" id="goalNum">0</div><div class="stat-label">Wishes</div></div>
            <div class="stat-item"><div class="stat-num" id="doneNum">0</div><div class="stat-label">Done</div></div>
            <div class="stat-item"><div class="stat-num" id="spentNum">0</div><div class="stat-label">Spent</div></div>
        </div>
    </div>

    <!-- 心愿清单 -->
    <div class="card">
        <div class="card-title">心愿清单 <span class="en-deco">· my wishes</span></div>
        <div id="goalList"></div>
        <div class="fold-section">
            <button class="fold-toggle" id="foldBtn">▶ 已实现 (<span id="achCount">0</span>)</button>
            <div class="fold-body" id="achBody"></div>
        </div>
        <button class="add-btn" id="showGoalModal">＋ 许个小心愿</button>
    </div>

    <!-- 日记本：按天 -->
    <div class="card">
        <div class="card-title">日记本 <span class="en-deco">· daily pages</span></div>
        <!-- 日期导航 -->
        <div class="date-nav">
            <button id="prevDay"><i class="fas fa-chevron-left"></i></button>
            <span class="mid" id="dateLabel">2026-08-27 周四</span>
            <div class="right-cell">
                <button id="todayBtn" class="today">今天</button>
                <button id="nextDay"><i class="fas fa-chevron-right"></i></button>
            </div>
        </div>

        <!-- 任务 -->
        <div style="margin-bottom:6px;font-family:'Noto Serif SC',serif;font-weight:455;font-size:14px;color:var(--text-main);letter-spacing:0.039em;">今日任务</div>
        <div id="taskList"></div>
        <button class="add-btn" id="showTaskModal">＋ 写个小任务</button>

        <!-- 今日随笔 -->
        <div class="note-area" style="margin-top:14px;">
            <div style="font-family:'Noto Serif SC',serif;font-weight:453;font-size:14px;color:var(--text-main);margin-bottom:6px;letter-spacing:0.039em;">今日随笔</div>
            <textarea id="noteInput" placeholder="今天发生了什么……"></textarea>
            <button class="save-note" id="saveNote">保存随笔</button>
        </div>
    </div>

    <div class="footer">small days, soft wants.</div>

    <!-- 换肤切换栏 -->
    <div class="theme-dots">
        <button class="theme-dot" data-theme="lavender" style="--dot:#c8afe0" title="薰衣草紫" aria-label="薰衣草紫"></button>
        <button class="theme-dot" data-theme="gold" style="--dot:#c9a84c" title="鎏金岁月" aria-label="鎏金岁月"></button>
        <button class="theme-dot" data-theme="pink" style="--dot:#e89ab0" title="蜜桃轻粉" aria-label="蜜桃轻粉"></button>
        <button class="theme-dot" data-theme="blue" style="--dot:#79b8e0" title="晴空浅蓝" aria-label="晴空浅蓝"></button>
        <button class="theme-dot" data-theme="mint" style="--dot:#775c55" title="薄荷生巧" aria-label="薄荷生巧"></button>
        <button class="theme-dot" data-theme="night" style="--dot:#8878b8" title="星夜呢喃" aria-label="星夜呢喃"></button>
    </div>
</div>

<!-- 新增心愿弹窗 -->
<div class="overlay" id="goalOverlay">
    <div class="modal">
        <h2>写下小心愿</h2>
        <div class="field"><label>心愿名称</label><input type="text" id="gName" placeholder="如 去大理旅行"></div>
        <div class="field"><label>所需金额 (¥)</label><input type="number" id="gPrice" placeholder="2999" min="1"></div>
        <div class="field"><label>备注 (可选)</label><input type="text" id="gNote" placeholder="比如 住洱海边民宿"></div>
        <div class="modal-actions">
            <button class="btn-cancel" id="cancelGoal">取消</button>
            <button class="btn-confirm" id="confirmGoal">存入心愿瓶</button>
        </div>
    </div>
</div>

<!-- 新增任务弹窗 -->
<div class="overlay" id="taskOverlay">
    <div class="modal">
        <h2>今天做点什么</h2>
        <div class="field"><label>任务名称</label><input type="text" id="tName" placeholder="如 睡前看半小时书"></div>
        <div class="field"><label>奖励金币</label><input type="number" id="tReward" placeholder="10" min="1" value="10"></div>
        <div class="field">
            <label>任务类型</label>
            <div class="type-toggle" id="taskTypeToggle" style="margin-top:6px;">
                <button class="active" data-type="cyclic">🔄 循环</button>
                <button data-type="once">🧩 单次</button>
            </div>
        </div>
        <div class="modal-actions">
            <button class="btn-cancel" id="cancelTask">取消</button>
            <button class="btn-confirm" id="confirmTask">写入日记本</button>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/js/all.min.js"></script>
<script>
    // ====== 数据 ======
    let goals = [];
    let achieved = [];
    let cyclicTasks = [];
    let dailyRecords = {};
    let saved = 0;
    let spent = 0;
    let viewDate = new Date();

    function fmt(d) { return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
    function week(d) { return ['日','一','二','三','四','五','六'][d.getDay()]; }
    function uid() { return Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,6); }

    function load() {
        try {
            const g=localStorage.getItem('oc_goals'); if(g) goals=JSON.parse(g);
            const a=localStorage.getItem('oc_achieved'); if(a) achieved=JSON.parse(a);
            const c=localStorage.getItem('oc_cyclic'); if(c) cyclicTasks=JSON.parse(c);
            const d=localStorage.getItem('oc_daily'); if(d) dailyRecords=JSON.parse(d);
            const sv=localStorage.getItem('oc_saved'); if(sv) saved=parseFloat(sv)||0;
            const sp=localStorage.getItem('oc_spent'); if(sp) spent=parseFloat(sp)||0;
        }catch(e){}
    }
    function save() {
        localStorage.setItem('oc_goals',JSON.stringify(goals));
        localStorage.setItem('oc_achieved',JSON.stringify(achieved));
        localStorage.setItem('oc_cyclic',JSON.stringify(cyclicTasks));
        localStorage.setItem('oc_daily',JSON.stringify(dailyRecords));
        localStorage.setItem('oc_saved',saved.toString());
        localStorage.setItem('oc_spent',spent.toString());
    }

    function getRec(ds) {
        if(!dailyRecords[ds]) dailyRecords[ds] = {note:'', tasks:[]};
        return dailyRecords[ds];
    }

    function getDayTasks(ds) {
        const rec = getRec(ds);
        const cyc = cyclicTasks.map(ct => {
            const exist = rec.tasks.find(t => t.id===ct.id && t.isCyclic);
            return { id:ct.id, name:ct.name, reward:ct.reward, done:exist?exist.done:false, isCyclic:true };
        });
        const once = rec.tasks.filter(t => !t.isCyclic).map(t => ({...t}));
        return [...cyc, ...once];
    }

    function renderAll() {
        renderStats();
        renderGoals();
        renderAchieved();
        renderDayView();
    }

    function renderStats() {
        document.getElementById('savedNum').textContent = Math.floor(saved);
        document.getElementById('goalNum').textContent = goals.length;
        let totalDone = 0;
        for(let k in dailyRecords) {
            dailyRecords[k].tasks.forEach(t => { if(t.done) totalDone++; });
        }
        document.getElementById('doneNum').textContent = totalDone;
        document.getElementById('spentNum').textContent = Math.floor(spent);
    }

    function renderGoals() {
        const el = document.getElementById('goalList');
        if(!goals.length) { el.innerHTML='<div class="empty-hint">还没有心愿，许个愿吧</div>'; return; }
        el.innerHTML = goals.map((g,i) => {
            const pct = g.price>0 ? Math.min(100,(saved/g.price)*100) : 0;
            const canBuy = saved >= g.price;
            return `<div class="goal-item">
                <div class="goal-line1"><span class="goal-name">${esc(g.name)}</span>${g.note?`<span class="goal-note" title="${esc(g.note)}">${esc(g.note)}</span>`:''}<span class="goal-price">¥${g.price.toFixed(2)}</span></div>
                <div class="goal-line2"><div class="bar-bg"><div class="bar-fill" style="width:${pct}%"></div></div><span class="goal-pct">${Math.floor(pct)}%</span><button class="buy-btn" ${canBuy?'':'disabled'} onclick="doAchieve(${i})">${canBuy?'🎉 拿下':'💰 还不够'}</button><span class="goal-del" onclick="delGoal(${i})">✕</span></div>
            </div>`;
        }).join('');
    }

    function renderAchieved() {
        document.getElementById('achCount').textContent = achieved.length;
        const body = document.getElementById('achBody');
        if(!achieved.length) { body.innerHTML=''; return; }
        body.innerHTML = achieved.map((g,i) =>
            `<div class="achieve-item"><span>✅ ${esc(g.name)} · ¥${g.price.toFixed(2)}</span><button class="restore" onclick="undoAch(${i})">撤回</button></div>`
        ).join('');
    }

    function renderDayView() {
        const ds = fmt(viewDate);
        const rec = getRec(ds);
        document.getElementById('dateLabel').textContent = ds + ' 周' + week(viewDate);
        document.getElementById('todayBtn').style.visibility = ds === fmt(new Date()) ? 'hidden' : 'visible';
        const tasks = getDayTasks(ds);
        const el = document.getElementById('taskList');
        if(!tasks.length) { el.innerHTML='<div class="empty-hint">添加今天的任务吧</div>'; return; }
        let doneCnt=0;
        el.innerHTML = tasks.map(t => {
            if(t.done) doneCnt++;
            const chkCls = t.done?'task-check done':'task-check';
            const nameCls = t.done?'task-name line':'task-name';
            const badge = t.isCyclic?'<span class="badge">循环</span>':'<span class="badge">单次</span>';
            return `<div class="task-item">
                <div class="${chkCls}" onclick="toggleTask('${t.id}','${ds}')">${t.done?'✓':''}</div>
                <div class="task-info"><div class="task-line"><span class="${nameCls}">${esc(t.name)}</span>${badge}<span class="task-meta">+${t.reward}💰</span></div></div>
                <div class="del-task" onclick="delDayTask('${t.id}','${ds}')">✕</div>
            </div>`;
        }).join('');
        document.getElementById('noteInput').value = rec.note || '';
    }

    window.doAchieve = function(i) {
        const g = goals[i];
        if(saved < g.price) return;
        if(!confirm(`拿下「${g.name}」？扣 ¥${g.price.toFixed(2)}`)) return;
        saved -= g.price;
        spent += g.price;
        achieved.push({...g});
        goals.splice(i,1);
        save(); renderAll();
    };
    window.undoAch = function(i) {
        const g = achieved[i];
        if(!confirm(`撤回「${g.name}」？退回 ¥${g.price.toFixed(2)}`)) return;
        saved += g.price;
        spent -= g.price;
        goals.push({...g});
        achieved.splice(i,1);
        save(); renderAll();
    };
    window.delGoal = function(i) {
        if(!confirm('删掉这个心愿？')) return;
        goals.splice(i,1);
        save(); renderAll();
    };

    window.toggleTask = function(id, ds) {
        const rec = getRec(ds);
        const ci = cyclicTasks.findIndex(ct => ct.id === id);
        if(ci !== -1) {
            const exist = rec.tasks.find(t => t.id===id && t.isCyclic);
            if(exist) {
                if(exist.done) { exist.done=false; saved-=cyclicTasks[ci].reward; }
                else { exist.done=true; saved+=cyclicTasks[ci].reward; }
            } else {
                rec.tasks.push({id, name:cyclicTasks[ci].name, reward:cyclicTasks[ci].reward, done:true, isCyclic:true});
                saved+=cyclicTasks[ci].reward;
            }
        } else {
            const t = rec.tasks.find(t => t.id===id && !t.isCyclic);
            if(t) {
                if(t.done) { t.done=false; saved-=t.reward; }
                else { t.done=true; saved+=t.reward; }
            }
        }
        if(saved<0) saved=0;
        save(); renderAll();
    };

    window.delDayTask = function(id, ds) {
        const rec = getRec(ds);
        const ci = cyclicTasks.findIndex(ct => ct.id === id);
        if(ci !== -1) {
            if(!confirm('删除这个每日循环任务？（所有天的此任务都会消失）')) return;
            for(let k in dailyRecords) {
                dailyRecords[k].tasks = dailyRecords[k].tasks.filter(t => !(t.id===id && t.isCyclic));
            }
            cyclicTasks.splice(ci,1);
        } else {
            const t = rec.tasks.find(t => t.id===id && !t.isCyclic);
            if(t && t.done) { saved = Math.max(0, saved - t.reward); }
            rec.tasks = rec.tasks.filter(t => t.id !== id);
        }
        save(); renderAll();
    };

    document.getElementById('prevDay').onclick = () => { viewDate.setDate(viewDate.getDate()-1); renderAll(); };
    document.getElementById('nextDay').onclick = () => { viewDate.setDate(viewDate.getDate()+1); renderAll(); };
    document.getElementById('todayBtn').onclick = () => { viewDate = new Date(); renderAll(); };

    let taskIsCyclic = true;

    // 任务弹窗：类型切换
    document.getElementById('taskTypeToggle').onclick = function(e) {
        const btn = e.target.closest('button');
        if(!btn) return;
        const isCyc = btn.dataset.type === 'cyclic';
        taskIsCyclic = isCyc;
        this.querySelectorAll('button').forEach(b => b.classList.toggle('active', b === btn));
    };

    // 打开/关闭任务弹窗
    document.getElementById('showTaskModal').onclick = function() {
        // 重置表单
        document.getElementById('tName').value = '';
        document.getElementById('tReward').value = 10;
        taskIsCyclic = true;
        document.getElementById('taskTypeToggle').querySelectorAll('button').forEach(b => {
            b.classList.toggle('active', b.dataset.type === 'cyclic');
        });
        document.getElementById('taskOverlay').style.display = 'flex';
    };
    document.getElementById('cancelTask').onclick = () => document.getElementById('taskOverlay').style.display = 'none';

    // 确认添加任务
    document.getElementById('confirmTask').onclick = function() {
        const name = document.getElementById('tName').value.trim();
        const reward = parseFloat(document.getElementById('tReward').value) || 10;
        if(!name) { alert('请填写任务名称'); return; }
        const ds = fmt(viewDate);
        if(taskIsCyclic) {
            const id = uid();
            cyclicTasks.push({id, name, reward});
            const rec = getRec(ds);
            rec.tasks.push({id, name, reward, done:false, isCyclic:true});
        } else {
            const rec = getRec(ds);
            rec.tasks.push({id:uid(), name, reward, done:false, isCyclic:false});
        }
        document.getElementById('taskOverlay').style.display = 'none';
        save(); renderAll();
    };

    // 弹窗背景点击关闭
    document.getElementById('taskOverlay').onclick = function(e) {
        if(e.target === this) this.style.display = 'none';
    };
    document.getElementById('goalOverlay').onclick = function(e) {
        if(e.target === this) this.style.display = 'none';
    };

    document.getElementById('saveNote').onclick = function() {
        const ds = fmt(viewDate);
        const rec = getRec(ds);
        rec.note = document.getElementById('noteInput').value;
        save();
        alert('📝 随笔已保存');
    };

    document.getElementById('showGoalModal').onclick = () => document.getElementById('goalOverlay').style.display='flex';
    document.getElementById('cancelGoal').onclick = () => document.getElementById('goalOverlay').style.display='none';
    document.getElementById('confirmGoal').onclick = function() {
        const name = document.getElementById('gName').value.trim();
        const price = parseFloat(document.getElementById('gPrice').value);
        const note = document.getElementById('gNote').value.trim();
        if(!name || !price || price<=0) { alert('请填写心愿名称和金额'); return; }
        goals.push({name, price, note});
        document.getElementById('gName').value=''; document.getElementById('gPrice').value=''; document.getElementById('gNote').value='';
        document.getElementById('goalOverlay').style.display='none';
        save(); renderAll();
    };

    document.getElementById('foldBtn').onclick = function() {
        const body = document.getElementById('achBody');
        body.classList.toggle('open');
        this.innerHTML = body.classList.contains('open') ? '▼ 已实现 ('+achieved.length+')' : '▶ 已实现 ('+achieved.length+')';
    };

    function esc(s) { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

    load();
    renderAll();

    // ====== 换肤 ======
    const THEMES = ['lavender','gold','pink','blue','mint','night'];
    function applyTheme(name) {
        if (!THEMES.includes(name)) name = 'lavender';
        THEMES.forEach(t => document.body.classList.remove('theme-' + t));
        document.body.classList.add('theme-' + name);
        document.querySelectorAll('.theme-dot').forEach(d => d.classList.toggle('active', d.dataset.theme === name));
        localStorage.setItem('oc_theme', name);
    }
    document.querySelectorAll('.theme-dot').forEach(d => d.addEventListener('click', () => applyTheme(d.dataset.theme)));
    applyTheme(localStorage.getItem('oc_theme') || 'lavender');
</script>
</body>
</html>
